<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدينة المنازل - لعبة رياضيات</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf7ff,#fff7e8);min-height:100vh;color:#243447}
.wrap{max-width:650px;margin:auto;padding:20px}
.card{background:white;border-radius:24px;padding:24px;box-shadow:0 10px 30px #0001;text-align:center}
h1{font-size:30px;margin:8px}.sub{color:#667085}
.num{font-size:42px;font-weight:bold;letter-spacing:5px;margin:22px}
.houses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:bold;background:#edf4ff;color:#174a8b;cursor:pointer}
button:hover{transform:scale(1.02)}
.choice{margin:7px;padding:15px;background:#f6f7f9;border-radius:14px;cursor:pointer;font-size:22px}
.good{background:#e9f9ef}.bad{background:#fff0f0}
#feedback{min-height:30px;font-size:20px;font-weight:bold;margin:15px}
.hidden{display:none}.top{display:flex;justify-content:space-between;font-weight:bold}
.start{background:#2f80ed;color:white;font-size:20px;padding:17px 35px}
.small{font-size:14px;color:#667085}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<section id="start">
<h1>🏠 مدينة المنازل</h1>
<p class="sub">لعبة اكتشاف القيمة المنزلية</p>
<p>اختاري المنزل الصحيح ثم اختاري قيمة الرقم داخله.</p>
<button class="start" onclick="begin()">ابدئي اللعب 🎮</button>
</section>

<section id="game" class="hidden">
<div class="top"><span id="q"></span><span>⭐ <span id="score">0</span></span></div>
<h2>في العدد التالي:</h2>
<div class="num" id="number"></div>
<p>أين يقع الرقم <b id="digit"></b>؟</p>
<div class="houses" id="houses"></div>
<div id="values" class="hidden">
<p>ما قيمة الرقم في هذا المنزل؟</p>
<div id="choices"></div>
</div>
<div id="feedback"></div>
<button id="next" class="start hidden" onclick="next()">السؤال التالي ➜</button>
</section>

<section id="end" class="hidden">
<h1>🎉 أحسنتِ!</h1><p id="result"></p>
<button class="start" onclick="restart()">إعادة اللعب 🔄</button>
</section>
</div></div>

<script>
const data=[
["325416","3","مئات الألوف",300000],["741258","4","الآلاف",1000],
["906321","2","عشرات الألوف",20000],["483725","7","المئات",700],
["650194","9","العشرات",90],["218643","8","الآحاد",8],
["572310","7","الآلاف",2000],["834562","3","عشرات الألوف",30000]
];
const houses=["مئات الألوف","عشرات الألوف","الآلاف","المئات","العشرات","الآحاد"];
let i=0,score=0,selected=null;
function begin(){document.getElementById("start").classList.add("hidden");document.getElementById("game").classList.remove("hidden");load()}
function load(){
 selected=null; let d=data[i];
 q.textContent=`السؤال ${i+1} من ${data.length}`; scoreEl();
 number.textContent=d[0]; digit.textContent=d[1];
 feedback.textContent=""; values.classList.add("hidden");nextBtn(false);
 housesEl.innerHTML=houses.map(h=>`<button onclick="pickHouse('${h}')">${h}</button>`).join("");
}
function pickHouse(h){
 selected=h; let d=data[i];
 if(h!==d[2]){feedback.textContent="حاولي مرة أخرى 🌟";feedback.className="bad";return}
 feedback.textContent="ممتاز! هذا هو المنزل الصحيح 🏠";feedback.className="good";
 values.classList.remove("hidden");
 let correct=d[3], opts=[correct,correct*10,correct/10,correct+1000].filter(x=>Number.isInteger(x));
 opts=[...new Set(opts)].sort(()=>Math.random()-.5);
 choices.innerHTML=opts.map(x=>`<div class="choice" onclick="answer(${x},${correct})">${x.toLocaleString('ar-SA')}</div>`).join("");
}
function answer(x,c){
 if(x===c){score++;scoreEl();feedback.textContent="إجابة صحيحة! ⭐";feedback.className="good";choices.innerHTML="";nextBtn(true)}
 else {feedback.textContent="ليست القيمة الصحيحة، جربي مرة أخرى 😊";feedback.className="bad"}
}
function nextBtn(show){next.classList.toggle("hidden",!show)}
function next(){i++; if(i>=data.length){game.classList.add("hidden");end.classList.remove("hidden");result.textContent=`حصلتِ على ${score} من ${data.length} ⭐`;return} load()}
function scoreEl(){document.getElementById("score").textContent=score}
function restart(){i=0;score=0;end.classList.add("hidden");game.classList.remove("hidden");load()}
</script>
</body></html>
